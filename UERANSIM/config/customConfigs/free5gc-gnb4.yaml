mcc: '208'          # Mobile Country Code value
mnc: '93'           # Mobile Network Code value (2 or 3 digits)

nci: '0x000000050'  # NR Cell Identity (36-bit)
idLength: 32        # NR gNB ID length in bits [22...32]
tac: 2              # Tracking Area Code

linkIp: 192.168.144.247 #127.0.0.5   # gNB's local IP address for Radio Link Simulation (Usually same with local IP)
ngapIp: 192.168.144.244 #10.57.33.244 # # gNB's local IP address for N2 Interface (Usually same with local IP)
gtpIp:  192.168.144.247 #10.57.33.247 # # gNB's local IP address for N3 Interface (Usually same with local IP)

# List of AMF address information
amfConfigs:
  - address:   192.168.144.151 #10.57.33.151 #
    port: 38412

# List of supported S-NSSAIs by this gNB
slices:
  - sst: 0x1
    sd: 0x010203

# Indicates whether or not SCTP stream number errors should be ignored.
ignoreStreamIds: true

# Optional: Physical location of the gNB (x, y, z coordinates)
phyLocation:
   - on: true
x: 170
y: 5
z: 0
