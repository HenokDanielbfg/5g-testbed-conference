info:
  version: 1.0.0
  description: NWDAF initial local configuration

configuration:
  sbi:
    scheme: http
    registerIPv4: 127.0.0.47
    bindingIPv4: 127.0.0.47
    port: 8000
  serviceNameList:
    - nnwdaf-analyticsinfo
    - nnwdaf-eventssubscription
  nrfUri: http://127.0.0.10:8000
  nrfCertPem: cert/nrf.pem # NRF Certificate
  eventSubscription:
    amfEventSubscription:
      nfUri: http://127.0.0.18:8000
      events:
        - LOCATION_REPORT
        - REGISTRATION_STATE_REPORT
        - CONNECTIVITY_STATE_REPORT
        - REACHABILITY_REPORT
        - TIMEZONE_REPORT
        - ACCESS_TYPE_REPORT
        - SUBSCRIBED_DATA_REPORT
    smfEventSubscription:
      nfUri: http://127.0.0.2:8000
      events:
        - PDU_SES_EST
        - PDU_SES_REL
        - UP_PATH_CH
        - UE_IP_CH

logger:
  enable: true
  level: info
  reportCaller: false
